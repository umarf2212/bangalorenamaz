<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f1e9">
    <meta name="description" content="Bengaluru prayer times with a simple countdown to the next salah.">
    <title>Namaz Timings · Bengaluru</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17342c;
            --muted: #6f7d77;
            --accent: #15845f;
            --accent-soft: #dcece5;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-strong: #fffef9;
            --line: rgba(23, 52, 44, 0.11);
            --page: #f3f1e9;
            --shadow: 0 18px 50px rgba(32, 61, 51, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(24px, 5vw, 64px) 20px;
            background:
                radial-gradient(circle at 10% 0%, rgba(21, 132, 95, 0.09), transparent 34rem),
                var(--page);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(100%, 940px);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: clamp(30px, 6vw, 64px);
        }

        .eyebrow,
        .date {
            margin: 0;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 650;
            letter-spacing: 0.13em;
            line-height: 1.5;
            text-transform: uppercase;
        }

        h1 {
            margin: 5px 0 0;
            font-size: clamp(1.55rem, 3vw, 2.1rem);
            font-weight: 680;
            letter-spacing: -0.045em;
        }

        .date {
            max-width: 220px;
            padding-top: 7px;
            text-align: right;
            text-transform: none;
            letter-spacing: 0.02em;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            gap: 28px;
            padding: clamp(24px, 5vw, 44px);
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--surface-strong);
            box-shadow: var(--shadow);
        }

        .hero-label {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 9px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 5px var(--accent-soft);
        }

        .next-name {
            margin: 0;
            font-size: clamp(2.7rem, 9vw, 5.75rem);
            font-weight: 650;
            letter-spacing: -0.075em;
            line-height: 0.96;
        }

        .countdown {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-variant-numeric: tabular-nums;
        }

        .next-time {
            margin: 0;
            color: var(--accent);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 620;
            letter-spacing: -0.055em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .rings {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .prayer {
            position: relative;
            min-width: 0;
            padding: 18px 12px 16px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--surface);
            text-align: center;
            transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
        }

        .prayer.next {
            border-color: rgba(21, 132, 95, 0.24);
            background: var(--surface-strong);
            transform: translateY(-3px);
        }

        .prayer-name {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 750;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .prayer.next .prayer-name { color: var(--accent); }

        .ring-wrap {
            position: relative;
            width: min(100%, 128px);
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .ring {
            display: block;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .ring circle {
            fill: none;
            stroke-width: 7;
        }

        .ring-track { stroke: var(--accent-soft); }

        .ring-progress {
            stroke: var(--accent);
            stroke-linecap: round;
            transition: stroke-dashoffset 700ms ease;
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
        }

        .prayer-time {
            font-size: clamp(1rem, 2.1vw, 1.25rem);
            font-weight: 680;
            letter-spacing: -0.035em;
            font-variant-numeric: tabular-nums;
        }

        .period {
            margin-top: 2px;
            color: var(--muted);
            font-size: 0.64rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status {
            min-height: 22px;
            margin: 19px 2px 0;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.6;
            text-align: center;
        }

        .status.error { color: #a0443d; }

        footer {
            margin-top: clamp(38px, 7vw, 70px);
            color: var(--muted);
            font-size: 0.72rem;
            line-height: 1.65;
            text-align: center;
        }

        @media (max-width: 720px) {
            body { padding: 16px 12px 20px; }

            .topbar {
                gap: 12px;
                margin-bottom: 16px;
            }

            .eyebrow,
            .date { font-size: 0.66rem; }

            h1 {
                margin-top: 3px;
                font-size: 1.35rem;
            }

            .date {
                max-width: 150px;
                padding-top: 3px;
            }

            .hero {
                grid-template-columns: 1fr auto;
                align-items: end;
                gap: 14px;
                padding: 18px;
                border-radius: 20px;
            }

            .hero-label {
                gap: 7px;
                margin-bottom: 6px;
                font-size: 0.68rem;
            }

            .pulse {
                width: 5px;
                height: 5px;
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .next-name { font-size: 2.45rem; }

            .countdown {
                margin-top: 7px;
                font-size: 0.85rem;
            }

            .next-time { font-size: 1.5rem; }

            .rings {
                grid-template-columns: repeat(6, minmax(0, 1fr));
                gap: 8px;
                margin-top: 10px;
            }

            .prayer {
                grid-column: span 2;
                padding: 10px 4px 9px;
                border-radius: 16px;
            }

            .prayer:nth-child(4) { grid-column: 2 / span 2; }
            .prayer:nth-child(5) { grid-column: 4 / span 2; }
            .prayer.next { transform: translateY(-2px); }

            .prayer-name {
                margin-bottom: 4px;
                font-size: 0.62rem;
                letter-spacing: 0.08em;
            }

            .ring-wrap { width: min(100%, 84px); }
            .ring circle { stroke-width: 6; }
            .prayer-time { font-size: 0.9rem; }
            .period { font-size: 0.55rem; }

            .status {
                min-height: 16px;
                margin-top: 10px;
                font-size: 0.66rem;
            }

            footer {
                margin-top: 16px;
                font-size: 0.62rem;
                line-height: 1.45;
            }
        }

        @media (max-width: 360px) {
            body { padding-inline: 10px; }
            h1 { font-size: 1.25rem; }
            .date { max-width: 125px; }
            .hero { padding: 16px; }
            .next-name { font-size: 2.15rem; }
            .next-time { font-size: 1.35rem; }
            .rings { gap: 6px; }
            .prayer { padding-inline: 2px; }
            .ring-wrap { width: min(100%, 76px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<main>
    <header class="topbar">
        <div>
            <p class="eyebrow">Bengaluru</p>
            <h1>Namaz timings</h1>
        </div>
        <p class="date" id="date-label" aria-live="polite">Loading today’s schedule…</p>
    </header>

    <section class="hero" aria-labelledby="next-prayer-name">
        <div>
            <p class="hero-label"><span class="pulse" aria-hidden="true"></span>Next prayer</p>
            <h2 class="next-name" id="next-prayer-name">—</h2>
            <p class="countdown" id="countdown" aria-live="polite">Finding the next prayer</p>
        </div>
        <p class="next-time" id="next-prayer-time">—</p>
    </section>

    <section class="rings" id="prayer-rings" aria-label="Today’s five prayer times"></section>
    <p class="status" id="status" role="status"></p>

    <footer>
        Local timetable · Hanafi Asr · Dhuhr begins 10 minutes after Zawal<br>
        Rings empty as each prayer approaches.
    </footer>
</main>

<noscript>This page needs JavaScript to load today’s timetable.</noscript>

<script>
    const TIME_ZONE = "Asia/Kolkata";
    const MONTHS = [
        "january", "february", "march", "april", "may", "june",
        "july", "august", "september", "october", "november", "december"
    ];
    const RING_RADIUS = 46;
    const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
    const scheduleCache = new Map();

    const dateLabel = document.getElementById("date-label");
    const nextPrayerName = document.getElementById("next-prayer-name");
    const nextPrayerTime = document.getElementById("next-prayer-time");
    const countdown = document.getElementById("countdown");
    const rings = document.getElementById("prayer-rings");
    const status = document.getElementById("status");

    function bengaluruNow() {
        const parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: TIME_ZONE,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        }).formatToParts(new Date());
        const value = type => Number(parts.find(part => part.type === type).value);

        return new Date(Date.UTC(
            value("year"), value("month") - 1, value("day"),
            value("hour"), value("minute"), value("second")
        ));
    }

    function shiftDate(date, days) {
        const shifted = new Date(date);
        shifted.setUTCDate(shifted.getUTCDate() + days);
        return shifted;
    }

    async function loadMonth(monthIndex) {
        if (!scheduleCache.has(monthIndex)) {
            scheduleCache.set(
                monthIndex,
                fetch(`months/${MONTHS[monthIndex]}.json`).then(response => {
                    if (!response.ok) throw new Error("The timetable could not be loaded.");
                    return response.json();
                })
            );
        }
        return scheduleCache.get(monthIndex);
    }

    function prayerMoment(date, time, period, offsetMinutes = 0) {
        const [rawHour, minute] = time.split(":").map(Number);
        let hour = rawHour;
        if (period === "pm" && hour < 12) hour += 12;
        if (period === "am" && hour === 12) hour = 0;

        return new Date(Date.UTC(
            date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(),
            hour, minute + offsetMinutes
        ));
    }

    async function prayersFor(date) {
        const schedule = await loadMonth(date.getUTCMonth());
        const day = schedule.data.find(item => Number(item.date) === date.getUTCDate());
        if (!day) throw new Error("No timetable entry was found for this date.");

        return [
            { name: "Fajr", moment: prayerMoment(date, day.predawn, "am") },
            { name: "Dhuhr", moment: prayerMoment(date, day.zawal, "pm", 10) },
            { name: "Asr", moment: prayerMoment(date, day.asr_hanafi, "pm") },
            { name: "Maghrib", moment: prayerMoment(date, day.sunset, "pm") },
            { name: "Isha", moment: prayerMoment(date, day.isha, "pm") }
        ];
    }

    function formatTime(date) {
        const text = new Intl.DateTimeFormat("en-IN", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
            timeZone: "UTC"
        }).format(date);
        const [time, period] = text.split(/\s/);
        return { time, period: period.toUpperCase() };
    }

    function formatCountdown(milliseconds) {
        const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        if (hours > 0) return `${hours}h ${String(minutes).padStart(2, "0")}m`;
        return `${minutes}m ${String(seconds).padStart(2, "0")}s`;
    }

    function formatDate(date, isTomorrow) {
        const formatted = new Intl.DateTimeFormat("en-IN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            timeZone: "UTC"
        }).format(date);
        return isTomorrow ? `Tomorrow · ${formatted}` : formatted;
    }

    function ringCard(prayer, progress, isNext) {
        const formatted = formatTime(prayer.moment);
        const offset = RING_CIRCUMFERENCE * (1 - progress);
        const percentage = Math.round(progress * 100);

        return `
            <article class="prayer${isNext ? " next" : ""}"${isNext ? ' aria-current="true"' : ""}>
                <h3 class="prayer-name">${prayer.name}</h3>
                <div class="ring-wrap" aria-label="${prayer.name}: ${percentage}% of the interval remaining">
                    <svg class="ring" viewBox="0 0 112 112" aria-hidden="true">
                        <circle class="ring-track" cx="56" cy="56" r="${RING_RADIUS}"></circle>
                        <circle class="ring-progress" cx="56" cy="56" r="${RING_RADIUS}"
                            stroke-dasharray="${RING_CIRCUMFERENCE}"
                            stroke-dashoffset="${offset}"></circle>
                    </svg>
                    <div class="ring-center">
                        <span class="prayer-time">${formatted.time}</span>
                        <span class="period">${formatted.period}</span>
                    </div>
                </div>
            </article>`;
    }

    async function render() {
        try {
            const now = bengaluruNow();
            const today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
            const todayPrayers = await prayersFor(today);
            const afterIsha = now >= todayPrayers.at(-1).moment;
            const displayDate = afterIsha ? shiftDate(today, 1) : today;
            const prayers = afterIsha ? await prayersFor(displayDate) : todayPrayers;
            const nextIndex = prayers.findIndex(prayer => prayer.moment > now);
            const next = prayers[nextIndex];
            const previous = nextIndex === 0
                ? (await prayersFor(shiftDate(displayDate, -1))).at(-1)
                : prayers[nextIndex - 1];
            const interval = next.moment - previous.moment;
            const remaining = Math.min(1, Math.max(0, (next.moment - now) / interval));

            dateLabel.textContent = formatDate(displayDate, afterIsha);
            nextPrayerName.textContent = next.name;
            const formattedNextTime = formatTime(next.moment);
            nextPrayerTime.textContent = `${formattedNextTime.time} ${formattedNextTime.period}`;
            countdown.textContent = `${formatCountdown(next.moment - now)} remaining`;
            rings.innerHTML = prayers.map((prayer, index) => {
                const progress = index < nextIndex ? 0 : index === nextIndex ? remaining : 1;
                return ringCard(prayer, progress, index === nextIndex);
            }).join("");
            status.textContent = "Updated just now · Bengaluru time";
            status.classList.remove("error");
        } catch (error) {
            status.textContent = error.message || "The timetable could not be loaded.";
            status.classList.add("error");
        }
    }

    render();
    setInterval(render, 1000);
</script>
</body>
</html>
